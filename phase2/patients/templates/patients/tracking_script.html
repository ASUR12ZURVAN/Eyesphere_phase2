<script>
    console.log('Retention tracking script loaded');
    
    // ===== CSRF Token Helper =====
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // ===== Retention Time Tracking ONLY =====
    const RETENTION_URL = '/patient/api/update-retention/';
    const HEARTBEAT_INTERVAL = 60; // seconds
    let lastSentAt = Date.now();

    function getElapsedSeconds() {
        const now = Date.now();
        const elapsed = Math.floor((now - lastSentAt) / 1000);
        lastSentAt = now;
        return elapsed;
    }

    function sendRetention(seconds) {
        if (seconds <= 0) return;
        const payload = JSON.stringify({ elapsed_seconds: seconds });
        
        if (navigator.sendBeacon) {
            const blob = new Blob([payload], { type: 'application/json' });
            navigator.sendBeacon(RETENTION_URL, blob);
        } else {
            fetch(RETENTION_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: payload,
                keepalive: true
            }).catch(() => {});
        }
    }

    setInterval(function () {
        sendRetention(getElapsedSeconds());
    }, HEARTBEAT_INTERVAL * 1000);

    window.addEventListener('beforeunload', function () {
        sendRetention(getElapsedSeconds());
    });
</script>

<button class="floating-book-btn" onclick="openBookModal()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="8.5" cy="7" r="4"></circle>
        <line x1="20" y1="8" x2="20" y2="14"></line>
        <line x1="17" y1="11" x2="23" y2="11"></line>
    </svg>
    <span class="btn-text">Book AT home test</span>
</button>

<div class="book-modal-overlay" id="bookModal">
    <div class="book-modal-content">
        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1.5rem;">
            <div>
                <h2 style="font-size: 1.5rem; color: #0f172a; margin-bottom: 0.2rem;">Book At-Home Test</h2>
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 0.5rem;">
                    <p style="color: #64748b; font-size: 0.9rem; margin: 0;">Request a visit</p>
                    <button type="button" onclick="autoFillDetails()" style="background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                        Auto-fill Profile
                    </button>
                </div>
            </div>
            <button onclick="closeBookModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #94a3b8;">&times;</button>
        </div>

        <form id="bookHomeTestForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="book-form-group">
                    <label>Phone Number</label>
                    <input type="text" value="{{ user.phone_number }}" disabled>
                </div>
                <div class="book-form-group">
                    <label>Email</label>
                    <input type="text" value="{{ user.email|default:'Not provided' }}" disabled>
                </div>
            </div>

            <div class="book-form-group">
                <label>Company Name</label>
                <input type="text" id="bookCompany" value="Loading..." disabled>
            </div>

            <div class="book-form-group">
                <label>Select Optometrist</label>
                <select id="bookOptometrist" required>
                    <option value="" disabled selected>Select an optometrist</option>
                    <option value="auto">Auto-assign (Recommended)</option>
                </select>
            </div>

            <div class="book-form-group">
                <label>Visit Address</label>
                <textarea id="bookAddress" rows="3" placeholder="Enter full address for the visit" required></textarea>
            </div>

            <button type="submit" class="book-submit-btn" id="bookSubmitBtn">Confirm Booking</button>
        </form>
    </div>
</div>

<script>
    async function openBookModal() {
        document.getElementById('bookModal').style.display = 'flex';
        
        // Fetch Optometrists
        try {
            const resp = await fetch('/patient/api/get-optometrists/');
            const opts = await resp.json();
            const select = document.getElementById('bookOptometrist');
            select.innerHTML = '<option value="" disabled>Select an optometrist</option><option value="auto" selected>Auto-assign (Recommended)</option>';
            opts.forEach(o => {
                const opt = document.createElement('option');
                opt.value = o.id;
                opt.textContent = o.name;
                select.appendChild(opt);
            });
        } catch (e) {
            console.error('Failed to load optometrists', e);
        }

        // Initial Profile Fetch
        await autoFillDetails();
    }

    async function autoFillDetails() {
        try {
             const companyInput = document.getElementById('bookCompany');
             const addressInput = document.getElementById('bookAddress');
             
             const resp = await fetch('/patient/api/get-profile/');
             const data = await resp.json();
             
             companyInput.value = data.company_name || "Not applicable";
             addressInput.value = data.address || "";
             
             // Visual feedback for auto-fill
             companyInput.style.borderColor = "#059669";
             addressInput.style.borderColor = "#059669";
             setTimeout(() => {
                 companyInput.style.borderColor = "#e2e8f0";
                 addressInput.style.borderColor = "#e2e8f0";
             }, 1000);
        } catch (e) {
            console.error('Failed to load profile details', e);
        }
    }

    function closeBookModal() {
        document.getElementById('bookModal').style.display = 'none';
    }

    document.getElementById('bookHomeTestForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('bookSubmitBtn');
        const optometrist_id = document.getElementById('bookOptometrist').value;
        const address = document.getElementById('bookAddress').value;

        submitBtn.disabled = true;
        submitBtn.innerText = 'Booking...';

        try {
            const response = await fetch('/patient/api/book-home-test/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ optometrist_id, address })
            });

            const result = await response.json();
            if (response.ok) {
                alert('Success! Your home test visit has been requested.');
                closeBookModal();
            } else {
                alert('Error: ' + (result.error || 'Something went wrong'));
            }
        } catch (error) {
            alert('An error occurred. Please try again.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Confirm Booking';
        }
    });
</script>
