<script>
    console.log('Retention tracking script loaded');
    
    // ===== CSRF Token Helper =====
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // ===== Retention Time Tracking ONLY =====
    const RETENTION_URL = '/patient/api/update-retention/';
    const HEARTBEAT_INTERVAL = 60; // seconds
    let lastSentAt = Date.now();

    function getElapsedSeconds() {
        const now = Date.now();
        const elapsed = Math.floor((now - lastSentAt) / 1000);
        lastSentAt = now;
        return elapsed;
    }

    function sendRetention(seconds) {
        if (seconds <= 0) return;
        const payload = JSON.stringify({ elapsed_seconds: seconds });
        
        if (navigator.sendBeacon) {
            const blob = new Blob([payload], { type: 'application/json' });
            navigator.sendBeacon(RETENTION_URL, blob);
        } else {
            fetch(RETENTION_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: payload,
                keepalive: true
            }).catch(() => {});
        }
    }

    setInterval(function () {
        sendRetention(getElapsedSeconds());
    }, HEARTBEAT_INTERVAL * 1000);

    window.addEventListener('beforeunload', function () {
        sendRetention(getElapsedSeconds());
    });
</script>
