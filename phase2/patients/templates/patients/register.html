{% extends "optometrist/base.html" %}

{% block title %}Register | EyeSphere Patient{% endblock title %}

{% block content %}
<div class="glass-card animate-fade-in" style="max-width: 550px;">
    <h1 style="color: #059669;">Join EyeSphere</h1>
    <p class="subtitle">Create your patient account to view your records</p>

    <form id="registerForm">
        {% csrf_token %}
        <div class="form-group">
            <label>Registration Type</label>
            <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; flex: 1;">
                    <input type="radio" name="login_type" value="at_home" checked onchange="toggleCorporateFields(false)">
                    <span>At Home Login</span>
                </label>
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; flex: 1;">
                    <input type="radio" name="login_type" value="corporate" onchange="toggleCorporateFields(true)">
                    <span>Corporate Login</span>
                </label>
            </div>
        </div>

        <div id="corporateFields" style="display: none; border: 1px dashed #059669; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; background: rgba(5, 150, 105, 0.05);">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="company_name">Company Name <span style="color: #ed4337;">*</span></label>
                    <input type="text" id="company_name" name="company_name" placeholder="Acme Corp">
                </div>
                <div class="form-group">
                    <label for="designation">Designation (Optional)</label>
                    <input type="text" id="designation" name="designation" placeholder="Manager">
                </div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="phone_number">Phone Number</label>
                <input type="tel" id="phone_number" name="phone_number" placeholder="+1234567890" required>
            </div>
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" placeholder="25" min="1" max="150" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit;">
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; background: var(--card-bg);">
                    <option value="" disabled selected>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email Address (Optional)</label>
            <input type="email" id="email" name="email" placeholder="john.doe@example.com">
        </div>

        <!-- CMP (Chronic Management Program) Identification -->
        <div class="form-group">
            <label>Are you a CMP Patient?</label>
            <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; flex: 1;">
                    <input type="radio" name="is_cmp_patient" value="yes" onchange="toggleCmpFields(true)">
                    <span>Yes</span>
                </label>
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; flex: 1;">
                    <input type="radio" name="is_cmp_patient" value="no" checked onchange="toggleCmpFields(false)">
                    <span>No</span>
                </label>
            </div>
        </div>

        <div id="cmpFields" class="form-group" style="display: none; border: 1px dashed #059669; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; background: rgba(5, 150, 105, 0.05);">
            <label for="cmp_type">Select CMP Type <span style="color: #ed4337;">*</span></label>
            <select id="cmp_type" name="cmp_type" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; background: var(--card-bg); color: var(--text-color);">
                <option value="" disabled selected>Select CMP Type</option>
                <option value="cmp1">Standard Diabetic CMP</option>
                <option value="cmp2">Advanced Diabetic CMP</option>
                <option value="cmp3">Pediatric Myopia CMP</option>
            </select>
        </div>

        <div class="form-group">
            <label for="address">Residential Address (Optional)</label>
            <textarea id="address" name="address" placeholder="123 Main St, City, Country" rows="2" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; resize: vertical; background: var(--card-bg); color: var(--text-color);"></textarea>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn" style="background: #059669; color: white; margin-top: 1rem;" id="registerBtn">
            <span>Create Account</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="8.5" cy="7" r="4"></circle>
                <line x1="20" y1="8" x2="20" y2="14"></line>
                <line x1="17" y1="11" x2="23" y2="11"></line>
            </svg>
        </button>
    </form>

    <div class="footer-link">
        Already have an account? <a href="{% url 'patient_login_page' %}" style="color: #059669;">Sign in here</a>
    </div>
</div>

<script>
    const registerForm = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');
    const corporateFields = document.getElementById('corporateFields');
    const companyNameInput = document.getElementById('company_name');

    function toggleCorporateFields(show) {
        if (show) {
            corporateFields.style.display = 'block';
            companyNameInput.required = true;
        } else {
            corporateFields.style.display = 'none';
            companyNameInput.required = false;
        }
    }

    const cmpFields = document.getElementById('cmpFields');
    const cmpTypeInput = document.getElementById('cmp_type');

    function toggleCmpFields(show) {
        if (show) {
            cmpFields.style.display = 'block';
            cmpTypeInput.required = true;
        } else {
            cmpFields.style.display = 'none';
            cmpTypeInput.required = false;
            cmpTypeInput.value = '';
        }
    }

    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(registerForm);
        const data = Object.fromEntries(formData.entries());

        if (data.password !== data.confirm_password) {
            alert('Passwords do not match!');
            return;
        }

        registerBtn.disabled = true;
        registerBtn.querySelector('span').innerText = 'Creating Account...';

        try {
            const response = await fetch('{% url "patient_register_page" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': data.csrfmiddlewaretoken
                },
                body: JSON.stringify({
                    name: data.name,
                    phone_number: data.phone_number,
                    email: data.email || null,
                    password: data.password,
                    age: parseInt(data.age),
                    gender: data.gender,
                    address: data.address || null,
                    login_type: data.login_type,
                    company_name: data.login_type === 'corporate' ? data.company_name : null,
                    designation: data.login_type === 'corporate' ? data.designation : null,
                    is_cmp_patient: data.is_cmp_patient === 'yes',
                    cmp_type: data.is_cmp_patient === 'yes' ? data.cmp_type : null
                })
            });

            const result = await response.json();

            if (response.ok) {
                alert('Account created successfully! Please sign in.');
                window.location.href = '{% url "patient_login_page" %}';
            } else {
                let errorMsg = '';
                if (typeof result === 'object') {
                    for (const [key, value] of Object.entries(result)) {
                        errorMsg += `${key}: ${value}\n`;
                    }
                }
                alert('Error:\n' + (errorMsg || 'Something went wrong'));
            }
        } catch (error) {
            console.error('Registration error:', error);
            alert('An error occurred. Please try again.');
        } finally {
            registerBtn.disabled = false;
            registerBtn.querySelector('span').innerText = 'Create Account';
        }
    });
</script>
{% endblock content %}
